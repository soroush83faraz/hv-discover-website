# Builds the design preview (site/, `npm run build:preview`) and publishes it to GitHub Pages.
# The preview is served under /<repository name>/, so PREVIEW_BASE follows the repository name.
name: Deploy design preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # Runs the normal build with PUBLIC_PREVIEW=1 (prebuild copies ../api, which the preview
      # then removes again: Pages has no PHP), rebases every URL and checks the result.
      - name: Build the design preview
        working-directory: site
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}
        run: npm run build:preview

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
