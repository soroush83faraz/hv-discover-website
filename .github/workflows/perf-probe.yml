name: Perf probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Server timing, headers and asset weight
        shell: bash
        run: |
          set +e
          fmt='dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} http=%{http_version} code=%{http_code}\n'
          for site in https://hvdiscover.com https://soroush83faraz.github.io/hv-discover-website; do
            echo; echo "################ $site"
            echo "--- response headers of the home page"
            curl -sI --compressed -H 'Accept-Encoding: br, gzip' "$site/" | tr -d '\r' | grep -iE '^(HTTP|server|content-type|content-encoding|cache-control|alt-svc|vary|connection|keep-alive|accept-ranges|content-length|age|x-cache|via|cf-)' 
            echo "--- HTTP/2 offered?"; curl -s --http2 -o /dev/null -w 'negotiated=%{http_version}\n' "$site/"
            echo "--- tiny file x5 (pure server latency)"
            for i in 1 2 3 4 5; do curl -s -o /dev/null -w "$fmt" "$site/robots.txt"; done
            echo "--- home page HTML x3"
            for i in 1 2 3; do curl -s --compressed -o /dev/null -w "$fmt" "$site/"; done
            html=$(curl -s --compressed "$site/")
            echo "--- weight of what the home page references"
            echo "$html" | grep -oE '(src|href|srcset)="[^"]+"' | grep -oE '(/[A-Za-z0-9_./%-]+\.(avif|webp|jpg|png|svg|css|js|woff2|mjs))' | sort -u > urls.txt
            wc -l < urls.txt | xargs echo "distinct asset URLs in the HTML:"
            total=0
            while read -r p; do
              u="$site$p"; [ "${p#/hv-discover-website}" != "$p" ] && u="https://soroush83faraz.github.io$p"
              out=$(curl -s --compressed -o /dev/null -w '%{size_download} %{time_starttransfer} %{time_total} %{http_code}' "$u")
              echo "$out $p"
            done < <(head -60 urls.txt) | sort -rn | head -14
            echo "--- 12 images in parallel (throughput)"
            start=$(date +%s.%N)
            grep -E '\.(avif|webp|jpg)$' urls.txt | head -12 | while read -r p; do u="$site$p"; [ "${p#/hv-discover-website}" != "$p" ] && u="https://soroush83faraz.github.io$p"; echo "$u"; done | xargs -P 6 -I{} curl -s -o /dev/null -w '%{size_download} ' {} 
            end=$(date +%s.%N); echo; echo "wall time: $(echo "$end - $start" | bc) s"
          done
      - name: Lighthouse (mobile, simulated slow 4G) on live and on the preview
        shell: bash
        run: |
          set +e
          npm i -g lighthouse@12 >/dev/null 2>&1
          for site in https://hvdiscover.com/ https://soroush83faraz.github.io/hv-discover-website/; do
            lighthouse "$site" --quiet --only-categories=performance --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json >/dev/null 2>&1
            echo "=== $site"
            node -e '
              const r=require("./lh.json"),a=r.audits;
              const f=k=>a[k]&&a[k].displayValue;
              console.log("score",Math.round(r.categories.performance.score*100),"| FCP",f("first-contentful-paint"),"| LCP",f("largest-contentful-paint"),"| TBT",f("total-blocking-time"),"| SI",f("speed-index"),"| TTFB(server-response-time)",f("server-response-time"),"| transfer",f("total-byte-weight"));
              for (const k of ["server-response-time","uses-http2","uses-long-cache-ttl","uses-text-compression","uses-optimized-images","modern-image-formats","render-blocking-resources","network-rtt","network-server-latency"]) if(a[k]) console.log(" ",k,"=>",a[k].displayValue||a[k].score);
              const lcp=a["largest-contentful-paint-element"]; if(lcp&&lcp.details&&lcp.details.items[0]) console.log("  LCP element:", JSON.stringify(lcp.details.items[0].items?.[0]?.node?.snippet||"").slice(0,120));
            '
          done
