; hvdiscover.com public_html root: PHP settings read by PHP-FPM / CGI / LiteSpeed (mod_php ignores
; this file). The static site runs no PHP here; only api/ does, and it has its own .user.ini.
;
; Uploading the build overwrites the old WordPress .user.ini, whose auto_prepend_file pointed to a
; plugin file (public_html/wp-content/advanced-headers.php) that is gone after the switch. Left in
; place, it would stop every /api/ request with a fatal error. PHP caches these files for up to
; 5 minutes (user_ini.cache_ttl). Denied to visitors by .htaccess.
auto_prepend_file = none
auto_append_file = none
