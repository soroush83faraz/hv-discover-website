; HV Discover form API: PHP settings for PHP-FPM / CGI / LiteSpeed hosts (api/ and below).
; Hosts running PHP as an Apache module use the same values from api/.htaccess.
; PHP re-reads this file every few minutes (user_ini.cache_ttl), not instantly.
display_errors = Off
display_startup_errors = Off
log_errors = On
mail.add_x_header = Off
post_max_size = 64K
max_input_vars = 50
max_input_nesting_level = 8
